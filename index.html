<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>mit yeuu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #ffd6e8;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CHỮ TỰ CO – KHÔNG QUÁ TO */
    .center-text,
    .love-text {
      font-size: clamp(1.7rem, 6vw, 2.6rem);
      font-weight: bold;
      text-align: center;
    }

    .center-text {
      position: absolute;
      color: #ff2f7a;
      cursor: pointer;
      user-select: none;
      animation: pulse 1.2s infinite;
      text-shadow:
        0 0 6px rgba(255, 80, 140, 0.6),
        0 0 16px rgba(255, 160, 200, 0.5);
      background: rgba(255,255,255,0.35);
      padding: 18px 36px;
      border-radius: 22px;
      backdrop-filter: blur(6px);
    }

    .center-text:hover {
      transform: scale(1.08);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .vanish {
      animation: vanish 1s forwards;
      pointer-events: none;
    }

    @keyframes vanish {
      0% { opacity: 1; transform: scale(1); filter: blur(0); }
      50% { transform: scale(1.4); filter: blur(6px); }
      100% { opacity: 0; transform: scale(2); filter: blur(18px); }
    }

    .love-text {
      position: absolute;
      color: #ff0055;
      opacity: 0;
      transform: scale(0.8);
      filter: blur(6px);
      transition: all 1s ease;
      text-shadow:
        0 0 10px rgba(255, 0, 90, 0.7),
        0 0 22px rgba(255, 150, 180, 0.6);
    }

    .love-text.show {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }

    .heart {
      position: absolute;
      top: -30px;
      color: #ff6fb1;
      pointer-events: none;
      animation: fall linear forwards;
      opacity: 0.9;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- CÂU LỪA -->
  <div id="startText" class="center-text">
    🎁 NHẬN NGAY 500.000₫ – CHỈ 1 CHẠM 🎁
  </div>

  <!-- CÂU LẬT MẶT -->
  <div id="loveText" class="love-text">
    CÓ CÁI BUỒI KHANG NGU
  </div>

  <script>
    const startText = document.getElementById('startText');
    const loveText = document.getElementById('loveText');

    startText.addEventListener('click', () => {
      startText.classList.add('vanish');

      setTimeout(() => {
        startText.style.display = 'none';
        loveText.classList.add('show');
        startHearts();
      }, 1000);
    });

    function startHearts() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = Math.random() * 16 + 12 + 'px';
        heart.style.animationDuration = Math.random() * 4 + 5 + 's';
        heart.style.filter = `blur(${Math.random() * 2 + 1}px)`;

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 9000);
      }, 280);
    }
  </script>

</body>
